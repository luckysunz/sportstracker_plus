{% extends "base.html" %}
{% block title %}Zugang – Sportstracker+{% endblock %}
{% block content %}
<h1>Zugangsdaten ändern</h1>
<section>
<form method="post" action="{{ url_for('password') }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label for="username">Benutzername</label>
<input type="text" id="username" name="username" value="{{ username }}" autocomplete="username">
<label for="old_password">Aktuelles Kennwort</label>
<input type="password" id="old_password" name="old_password" autocomplete="current-password">
<label for="new_password">Neues Kennwort</label>
<input type="password" id="new_password" name="new_password" autocomplete="new-password">
<p class="hint">Mindestens 8 Zeichen.</p>
<label for="new_password2">Neues Kennwort wiederholen</label>
<input type="password" id="new_password2" name="new_password2" autocomplete="new-password">
<p><button type="submit">Speichern</button></p>
</form>
</section>
{% endblock %}
